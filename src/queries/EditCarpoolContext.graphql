query EditCarpoolContext($eventId: Int!) {
  members {
    __typename
    email
    fullName
    location
    passengers
  }
  event(id: $eventId) {
    name
    carpools {
      driver {
        __typename
        email
        fullName
        location
        passengers
      }
      passengers {
        __typename
        email
        fullName
        location
        passengers
      }
    }
  }
}
